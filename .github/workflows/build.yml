name: Test and release 24 HR Towing

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisions:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    outputs:
      batches: ${{ steps.plan.outputs.batches }}
      desktop_builds: ${{ vars.ENABLE_DESKTOP_BUILDS != 'false' && 'true' || 'false' }}
      play_bundle: ${{ steps.plan.outputs.play_bundle }}
      # The README's download link follows default-branch GitHub releases.
      release: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        run: python3 .github/scripts/pushed_commits.py

  build:
    needs: revisions
    name: Check ${{ matrix.batch.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.revisions.outputs.batches) }}
    env:
      COMMIT_BATCH: ${{ toJSON(matrix.batch.commits) }}
      ENABLE_DESKTOP_BUILDS: ${{ needs.revisions.outputs.desktop_builds }}
      RELEASE_BUILD: ${{ needs.revisions.outputs.release }}
      PLAY_BUNDLE: ${{ needs.revisions.outputs.play_bundle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - name: Fingerprint LFS objects
        id: lfs-manifest
        shell: bash
        run: |
          oid_list=$(git lfs ls-files --long HEAD | cut -d ' ' -f1 | LC_ALL=C sort -u | git hash-object --stdin)
          printf 'digest=%s\n' "$oid_list" >> "$GITHUB_OUTPUT"
      - name: Restore LFS objects
        id: lfs-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .git/lfs/objects
          key: lfs-objects-v1-${{ runner.os }}-${{ steps.lfs-manifest.outputs.digest }}
          restore-keys: lfs-objects-v1-${{ runner.os }}-
      - name: Materialize LFS files
        shell: bash
        run: |
          git lfs install --local --skip-repo
          git lfs pull
      - name: Save LFS objects
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .git/lfs/objects
          key: ${{ steps.lfs-cache.outputs.cache-primary-key }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/24hrtowing/godot-4.7.2
          key: 24hrtowing-godot-4.7.2-linux-${{ needs.revisions.outputs.play_bundle == 'true' && 'app-bundle-template' || (needs.revisions.outputs.release != 'true' && 'editor' || (needs.revisions.outputs.desktop_builds == 'true' && 'all-templates' || 'android-templates')) }}-${{ hashFiles('.github/scripts/install-godot.sh') }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: needs.revisions.outputs.release == 'true' || needs.revisions.outputs.play_bundle == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verified Godot release
        run: |
          if [[ "$PLAY_BUNDLE" == true ]]; then
            bash .github/scripts/install-godot.sh --app-bundle
          elif [[ "$RELEASE_BUILD" == true ]]; then
            bash .github/scripts/install-godot.sh --export
          else
            bash .github/scripts/install-godot.sh
          fi
      - name: Run gameplay and regression tests
        run: python3 .github/scripts/build_commits.py test
      - name: Install Android build tools
        if: ${{ !cancelled() && needs.revisions.outputs.release == 'true' }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Play bundle build tools
        if: needs.revisions.outputs.play_bundle == 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.1.0' 'ndk;29.0.14206865'
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            -o "$RUNNER_TEMP/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check --status
      - name: Export tested commits
        if: ${{ (!cancelled() && needs.revisions.outputs.release == 'true') || (success() && needs.revisions.outputs.play_bundle == 'true') }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${GODOT_ANDROID_KEYSTORE_RELEASE_USER:?Missing ANDROID_KEY_ALIAS}"
          : "${GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          umask 077
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/24hrtowing.keystore"
          trap 'rm -f "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          if [[ "$PLAY_BUNDLE" == true ]]; then
            export BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool.jar"
            python3 .github/scripts/build_commits.py bundle
          else
            python3 .github/scripts/build_commits.py export
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && needs.revisions.outputs.release == 'true' && hashFiles('build/ci-releases/*/SHA256SUMS.txt') != '' }}
        with:
          name: release-${{ matrix.batch.label }}
          path: build/ci-releases/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.revisions.outputs.play_bundle == 'true'
        with:
          name: play-bundle-${{ matrix.batch.label }}
          path: build/play-bundle/
          compression-level: 0
          if-no-files-found: error

  native:
    needs: [revisions, build]
    if: ${{ !cancelled() && needs.revisions.outputs.release == 'true' && !github.event.deleted && needs.revisions.outputs.desktop_builds == 'true' }}
    name: Launch ${{ matrix.runner }} · ${{ matrix.batch.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-15]
        batch: ${{ fromJSON(needs.revisions.outputs.batches) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.batch.label }}
          path: releases
      - name: Launch packaged title for each built revision
        shell: bash
        run: python3 .github/scripts/native_smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('native-passes/*/*.sha256') != '' }}
        with:
          name: passed-${{ matrix.runner }}-${{ matrix.batch.label }}
          path: native-passes/
          retention-days: 3

  publish:
    needs: [revisions, build, native]
    if: ${{ !cancelled() && needs.revisions.outputs.release == 'true' && !github.event.deleted }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(needs.revisions.outputs.batches) }}
    # Serialize retries and simultaneous pushes for the same revision.
    concurrency:
      group: 24hrtowing-release-${{ matrix.batch.label }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.batch.label }}
          path: releases
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.revisions.outputs.desktop_builds == 'true' }}
        with:
          pattern: passed-*-${{ matrix.batch.label }}
          path: native-passes
          merge-multiple: true
      - name: Publish verified assets by source commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_BATCH: ${{ toJSON(matrix.batch.commits) }}
          ENABLE_DESKTOP_BUILDS: ${{ needs.revisions.outputs.desktop_builds }}
        run: bash .github/scripts/publish.sh

  latest:
    needs: [revisions, publish]
    if: ${{ !cancelled() && needs.revisions.outputs.release == 'true' && needs.publish.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Each job considers every published build, so one pending refresh is enough.
    concurrency:
      group: 24hrtowing-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mark the highest published build as Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/update-latest.sh
